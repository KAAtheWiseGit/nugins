[workspace]
resolver = "2"
members = [
	"endecode",
	"fs",
	"template",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Andrej Kolčin <self@kaathewise.net>"]
repository = "https://github.com/kaathewisegit/nugins"

[workspace.dependencies]
nu-glob = "0.113.1"
nu-json = "0.113.1"
nu-plugin = "0.113.1"
nu-protocol = { version = "0.113.1", features = ["plugin"] }

base32 = "0.5"
base62 = "2.2"
bs58 = "0.5"
chrono = "0.4.44"
deunicode = "1.6"
html-escape = "0.2"
serde_json = "1.0"
tinytemplate = "1.2"
z85 = "3.0"
